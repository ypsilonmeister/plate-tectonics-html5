<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>プレートテクトニクス</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="tabs">
    <button class="tab active" data-tab="crust">地殻</button>
    <button class="tab" data-tab="motion">プレート運動</button>
    <span id="appTitle">プレートテクトニクス</span>
  </div>
  <div id="stageWrap">
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
    <div id="stage">
      <!-- ================= 地殻タブ ================= -->
      <div id="crustUI" class="tabUI">
        <div class="panel" id="myCrustPanel">
          <div class="panelTitle big">地殻の組成</div>
          <div class="slider"><div class="sTitle">温度</div><input type="range" id="sTemp" min="0" max="4096"><div class="sLimits"><span>低め</span><span>高め</span></div></div>
          <div class="slider"><div class="sTitle">構成</div><input type="range" id="sComp" min="0" max="4096"><div class="sLimits"><span>鉄が多い</span><span>ケイ素が多い</span></div></div>
          <div class="slider"><div class="sTitle">厚み</div><input type="range" id="sThick" min="0" max="4096"><div class="sLimits"><span>薄い</span><span>厚い</span></div></div>
        </div>
        <div class="panel" id="zoomPanel">
          <div class="panelTitle">ズーム</div>
          <input type="range" id="sZoom" min="0" max="1" step="0.001" class="vertical">
        </div>
        <div class="crustSideLabel" id="oceanicLabel">海洋地殻</div>
        <div class="crustSideLabel" id="continentalLabel">大陸地殻</div>
        <div class="row bl">
          <div class="panel toolbox" id="crustToolbox"></div>
          <div class="resetPanel" id="crustReset"><button class="orange" data-action="resetAll">全てリセット</button></div>
        </div>
        <div class="row br">
          <div class="panel legend" id="crustLegend"></div>
          <div class="panel viewOptions" id="crustOptions"></div>
        </div>
      </div>

      <!-- ================= プレート運動タブ ================= -->
      <div id="motionUI" class="tabUI hidden">
        <div class="panel" id="playModePanel">
          <label><input type="radio" name="playMode" value="auto"> 自動モード</label>
          <label><input type="radio" name="playMode" value="manual" checked> 手動モード</label>
        </div>
        <div class="panel" id="motionTypePanel"></div>
        <div class="panel" id="timePanel">
          <div class="timeReadout"><div class="panelTitle">経過時間</div><div><span id="timeValue">0</span> <small>百万年</small></div></div>
          <div class="autoOnly speed"><input type="range" id="sSpeed" min="0.1" max="10" step="0.001"><div class="sLimits"><span>遅い</span><span>速い</span></div></div>
          <button class="autoOnly round" id="playPause" title="再生/一時停止">▶</button>
          <button class="autoOnly round small" id="stepBtn" title="1ステップ">▶|</button>
        </div>
        <div class="row bottom">
          <div class="panel toolbox" id="motionToolbox"></div>
          <div class="panel viewOptions" id="motionOptions"></div>
          <div class="resetPanel" id="motionReset">
            <button class="orange" data-action="rewind">巻き戻し</button>
            <button class="orange" data-action="newCrust">新しい地殻</button>
            <button class="orange" data-action="resetAll">全てリセット</button>
          </div>
          <div class="panel" id="crustChooser"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="lib/three.min.js"></script>
<script src="js/noise-texture.js"></script>
<script src="js/core.js"></script>
<script src="js/crust-model.js"></script>
<script src="js/plate-motion-model.js"></script>
<script src="js/tools.js"></script>
<script src="js/view.js"></script>
<script src="js/app.js"></script>
</body>
</html>
